<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gas Turbine Maintenance Assistant</title>
  <meta name="description" content="RAG assistant for GE GER-3620 Rev P heavy-duty gas turbine operation and maintenance documentation." />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --font: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --bg-page: #FFFFFF;
      --bg-sidebar: #F9F9F9;
      --bg-user-bubble: #F4F4F4;
      --bg-pill-hover: #F4F4F4;
      --bg-newchat-hover: #ECECEC;
      --text-main: #0D0D0D;
      --text-secondary: #6B6B6B;
      --border: #E5E5E5;
      --send-active: #0D0D0D;
      --send-inactive: #D7D7D7;
      --quote-border: #D7D7D7;
    }

    html, body {
      height: 100%;
      font-family: var(--font);
      font-size: 16px;
      line-height: 1.6;
      background: var(--bg-page);
      color: var(--text-main);
    }

    /* ── LAYOUT ───────────────────────────────────────────────────── */
    #app {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ── SIDEBAR ─────────────────────────────────────────────────── */
    #sidebar {
      width: 260px;
      flex-shrink: 0;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 16px 12px;
      gap: 12px;
      overflow: hidden;
    }

    #sidebar-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
      padding: 4px 8px;
      line-height: 1.4;
    }

    #new-chat-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 10px;
      border: none;
      background: transparent;
      cursor: pointer;
      font-family: var(--font);
      font-size: 14px;
      color: var(--text-main);
      width: 100%;
      text-align: left;
      transition: background 0.15s;
    }
    #new-chat-btn:hover { background: var(--bg-newchat-hover); }

    #new-chat-btn svg {
      flex-shrink: 0;
    }

    #sidebar-footer {
      margin-top: auto;
      font-size: 12px;
      color: var(--text-secondary);
      padding: 4px 8px;
      border-top: 1px solid var(--border);
      padding-top: 12px;
    }

    /* ── MAIN ────────────────────────────────────────────────────── */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    #chat-area {
      flex: 1;
      overflow-y: auto;
      scroll-behavior: smooth;
    }

    /* Center column */
    .col {
      max-width: 768px;
      margin: 0 auto;
      padding: 0 24px;
      width: 100%;
    }

    /* ── START SCREEN ─────────────────────────────────────────────── */
    #start-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 120px);
      padding: 40px 24px 20px;
    }

    #start-heading {
      font-size: 28px;
      font-weight: 600;
      color: var(--text-main);
      text-align: center;
      margin-bottom: 32px;
    }

    #sample-pills {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 520px;
    }

    .sample-pill {
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 10px 16px;
      font-family: var(--font);
      font-size: 14px;
      color: var(--text-main);
      background: var(--bg-page);
      cursor: pointer;
      text-align: left;
      transition: background 0.15s;
      line-height: 1.4;
    }
    .sample-pill:hover { background: var(--bg-pill-hover); }

    /* ── MESSAGES ─────────────────────────────────────────────────── */
    #messages {
      display: none;
      flex-direction: column;
      gap: 0;
      padding: 24px 0 16px;
    }

    .message-group {
      padding: 16px 0;
    }

    /* User bubble */
    .user-msg {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 8px;
    }
    .user-bubble {
      background: var(--bg-user-bubble);
      border-radius: 24px;
      padding: 10px 18px;
      max-width: 70%;
      font-size: 15px;
      color: var(--text-main);
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* Answer */
    .answer-msg {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 4px 0 8px;
    }

    .answer-text {
      font-size: 15px;
      color: var(--text-main);
      line-height: 1.7;
    }

    .answer-text.not-found {
      color: var(--text-secondary);
    }

    .answer-ref {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .answer-quote {
      border-left: 3px solid var(--quote-border);
      padding-left: 12px;
      font-size: 13px;
      font-style: italic;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    /* Thinking dot */
    .thinking {
      display: flex;
      align-items: center;
      height: 32px;
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--text-main);
      animation: pulse 1s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.15; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1); }
    }

    /* ── INPUT BAR ────────────────────────────────────────────────── */
    #input-bar-wrap {
      padding: 12px 24px 0;
      background: var(--bg-page);
    }

    #input-pill {
      max-width: 768px;
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      background: var(--bg-page);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 10px 10px 10px 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    #question-input {
      flex: 1;
      border: none;
      outline: none;
      resize: none;
      font-family: var(--font);
      font-size: 15px;
      line-height: 1.6;
      color: var(--text-main);
      background: transparent;
      max-height: calc(1.6em * 5 + 2px);
      overflow-y: auto;
      padding: 2px 0;
    }

    #question-input::placeholder {
      color: var(--text-secondary);
    }

    #send-btn {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--send-inactive);
      transition: background 0.15s;
      padding: 0;
    }
    #send-btn.active {
      background: var(--send-active);
    }
    #send-btn:disabled {
      cursor: not-allowed;
      background: var(--send-inactive);
    }
    #send-btn svg path {
      fill: #FFFFFF;
    }

    #input-disclaimer {
      max-width: 768px;
      margin: 6px auto 10px;
      text-align: center;
      font-size: 12px;
      color: var(--text-secondary);
    }

    /* ── RESPONSIVE ───────────────────────────────────────────────── */
    @media (max-width: 800px) {
      #sidebar { display: none; }
    }
  </style>
</head>
<body>
<div id="app">

  <!-- SIDEBAR -->
  <aside id="sidebar">
    <div id="sidebar-title">Gas Turbine Maintenance Assistant</div>
    <button id="new-chat-btn" aria-label="New chat">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M8 2.5a.75.75 0 0 1 .75.75v4h4a.75.75 0 0 1 0 1.5h-4v4a.75.75 0 0 1-1.5 0v-4h-4a.75.75 0 0 1 0-1.5h4v-4A.75.75 0 0 1 8 2.5Z" fill="#0D0D0D"/>
      </svg>
      New chat
    </button>
    <div id="sidebar-footer">Source: GE GER-3620 Rev P</div>
  </aside>

  <!-- MAIN -->
  <main id="main">
    <div id="chat-area">

      <!-- START SCREEN -->
      <div id="start-screen">
        <h1 id="start-heading">Gas Turbine Maintenance Assistant</h1>
        <div id="sample-pills">
          <button class="sample-pill" id="pill-1">What are the three main types of inspection?</button>
          <button class="sample-pill" id="pill-2">What does a maintenance factor of two mean?</button>
          <button class="sample-pill" id="pill-3">What is the purchase price of this gas turbine?</button>
          <button class="sample-pill" id="pill-4">What is the melting point of titanium?</button>
          <button class="sample-pill" id="pill-5">What is the recommended combustion-inspection interval in hours?</button>
        </div>
      </div>

      <!-- MESSAGES -->
      <div id="messages" class="col"></div>

    </div>

    <!-- INPUT BAR -->
    <div id="input-bar-wrap">
      <div id="input-pill">
        <textarea
          id="question-input"
          rows="1"
          placeholder="Ask a question about the document"
          aria-label="Question input"
        ></textarea>
        <button id="send-btn" aria-label="Send" disabled>
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M9 14.5V3.5M9 3.5L4 8.5M9 3.5L14 8.5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
      <p id="input-disclaimer">Answers come only from the document. Check the cited page.</p>
    </div>
  </main>

</div>

<script>
  const inputEl   = document.getElementById('question-input');
  const sendBtn   = document.getElementById('send-btn');
  const messagesEl = document.getElementById('messages');
  const startScreen = document.getElementById('start-screen');
  const newChatBtn  = document.getElementById('new-chat-btn');
  const chatArea    = document.getElementById('chat-area');

  let waiting = false;

  /* ── helpers ──────────────────────────────────────────────────── */
  function setWaiting(on) {
    waiting = on;
    inputEl.disabled = on;
    sendBtn.disabled = on || !inputEl.value.trim();
    if (on) sendBtn.classList.remove('active');
  }

  function updateSendBtn() {
    const hasText = inputEl.value.trim().length > 0;
    sendBtn.disabled = waiting || !hasText;
    sendBtn.classList.toggle('active', !waiting && hasText);
  }

  function autoResize() {
    inputEl.style.height = 'auto';
    const lineH = parseFloat(getComputedStyle(inputEl).lineHeight);
    const maxH = lineH * 5 + 4;
    inputEl.style.height = Math.min(inputEl.scrollHeight, maxH) + 'px';
  }

  function scrollToBottom() {
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  /* ── show messages pane, hide start screen ───────────────────── */
  function showMessages() {
    startScreen.style.display = 'none';
    messagesEl.style.display  = 'flex';
  }

  /* ── new chat ─────────────────────────────────────────────────── */
  function resetChat() {
    messagesEl.innerHTML = '';
    messagesEl.style.display = 'none';
    startScreen.style.display = '';
    inputEl.value = '';
    autoResize();
    updateSendBtn();
  }

  /* ── append a user bubble ────────────────────────────────────── */
  function appendUser(text) {
    showMessages();
    const group = document.createElement('div');
    group.className = 'message-group col';
    group.innerHTML = `<div class="user-msg"><div class="user-bubble">${escHtml(text)}</div></div>`;
    messagesEl.appendChild(group);
    scrollToBottom();
    return group;
  }

  /* ── append a thinking dot, return the placeholder group ─────── */
  function appendThinking() {
    const group = document.createElement('div');
    group.className = 'message-group col';
    group.innerHTML = `<div class="answer-msg"><div class="thinking"><div class="dot"></div></div></div>`;
    messagesEl.appendChild(group);
    scrollToBottom();
    return group;
  }

  /* ── replace thinking with real answer ───────────────────────── */
  function fillAnswer(group, data) {
    const ansDiv = group.querySelector('.answer-msg');
    ansDiv.innerHTML = '';

    if (!data.found) {
      const p = document.createElement('p');
      p.className = 'answer-text not-found';
      p.textContent = 'Not found';
      ansDiv.appendChild(p);
    } else {
      const p = document.createElement('p');
      p.className = 'answer-text';
      p.textContent = data.answer;
      ansDiv.appendChild(p);

      if (data.section || (data.pages && data.pages.length)) {
        const ref = document.createElement('p');
        ref.className = 'answer-ref';
        const parts = [];
        if (data.section) parts.push('Section: ' + data.section);
        if (data.pages && data.pages.length) parts.push('Page: ' + data.pages.join(', '));
        ref.textContent = parts.join(' | ');
        ansDiv.appendChild(ref);
      }

      if (data.quote) {
        const bq = document.createElement('blockquote');
        bq.className = 'answer-quote';
        bq.textContent = '\u201c' + data.quote + '\u201d';
        ansDiv.appendChild(bq);
      }
    }
    scrollToBottom();
  }

  /* ── fill answer with an error message ───────────────────────── */
  function fillError(group, msg) {
    const ansDiv = group.querySelector('.answer-msg');
    ansDiv.innerHTML = `<p class="answer-text not-found">${escHtml(msg)}</p>`;
    scrollToBottom();
  }

  /* ── escape HTML ─────────────────────────────────────────────── */
  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* ── main submit ─────────────────────────────────────────────── */
  async function submit(question) {
    question = question.trim();
    if (!question || waiting) return;

    setWaiting(true);
    inputEl.value = '';
    autoResize();
    updateSendBtn();

    appendUser(question);
    const thinkGroup = appendThinking();

    try {
      const res = await fetch('/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question })
      });
      if (!res.ok) {
        fillError(thinkGroup, 'Server error: ' + res.status);
      } else {
        const data = await res.json();
        fillAnswer(thinkGroup, data);
      }
    } catch (e) {
      fillError(thinkGroup, 'Server not reachable.');
    } finally {
      setWaiting(false);
      updateSendBtn();
    }
  }

  /* ── event listeners ─────────────────────────────────────────── */
  inputEl.addEventListener('input', () => { autoResize(); updateSendBtn(); });
  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      submit(inputEl.value);
    }
  });

  sendBtn.addEventListener('click', () => submit(inputEl.value));
  newChatBtn.addEventListener('click', resetChat);

  document.querySelectorAll('.sample-pill').forEach(pill => {
    pill.addEventListener('click', () => submit(pill.textContent.trim()));
  });
</script>
</body>
</html>
